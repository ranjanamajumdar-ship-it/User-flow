name: Deploy Pages (main + branch previews)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout config-v2
        uses: actions/checkout@v4
        with:
          ref: config-v2
          path: config-v2
        continue-on-error: true

      - name: Checkout context-card
        uses: actions/checkout@v4
        with:
          ref: context-card
          path: context-card
        continue-on-error: true

      - name: Checkout config-dashboard
        uses: actions/checkout@v4
        with:
          ref: config-dashboard
          path: config-dashboard
        continue-on-error: true

      - name: Checkout config-final
        uses: actions/checkout@v4
        with:
          ref: config-final
          path: config-final
        continue-on-error: true

      - name: Checkout build-flow-v2
        uses: actions/checkout@v4
        with:
          ref: build-flow-v2
          path: build-flow-v2
        continue-on-error: true

      - name: Checkout flow-canvas
        uses: actions/checkout@v4
        with:
          ref: flow-canvas
          path: flow-canvas
        continue-on-error: true

      - name: Checkout vertical-tree
        uses: actions/checkout@v4
        with:
          ref: vertical-tree
          path: vertical-tree
        continue-on-error: true

      - name: Checkout diagnostic-flow
        uses: actions/checkout@v4
        with:
          ref: diagnostic-flow
          path: diagnostic-flow
        continue-on-error: true

      - name: Checkout delta-view
        uses: actions/checkout@v4
        with:
          ref: delta-view
          path: delta-view
        continue-on-error: true


      - name: Checkout delta-v14-final
        uses: actions/checkout@v4
        with:
          ref: delta-v14-final
          path: delta-v14-final
        continue-on-error: true

      - name: Checkout delta-v13-cleanup
        uses: actions/checkout@v4
        with:
          ref: delta-v13-cleanup
          path: delta-v13-cleanup
        continue-on-error: true

      - name: Checkout delta-v12-fixes
        uses: actions/checkout@v4
        with:
          ref: delta-v12-fixes
          path: delta-v12-fixes
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir -p dist
          # Root = main branch contents
          if [ -d main ]; then
            cp -R main/. dist/ 2>/dev/null || true
            rm -rf dist/.git dist/.github
          fi
          # /config-v2/ = config-v2 branch contents
          if [ -d config-v2 ]; then
            mkdir -p dist/config-v2
            cp -R config-v2/. dist/config-v2/ 2>/dev/null || true
            rm -rf dist/config-v2/.git dist/config-v2/.github
          fi
          # /context-card/ = context-card branch contents
          if [ -d context-card ]; then
            mkdir -p dist/context-card
            cp -R context-card/. dist/context-card/ 2>/dev/null || true
            rm -rf dist/context-card/.git dist/context-card/.github
          fi
          # /config-dashboard/ = config-dashboard branch contents
          if [ -d config-dashboard ]; then
            mkdir -p dist/config-dashboard
            cp -R config-dashboard/. dist/config-dashboard/ 2>/dev/null || true
            rm -rf dist/config-dashboard/.git dist/config-dashboard/.github
          fi
          # /config-final/ = config-final branch contents
          if [ -d config-final ]; then
            mkdir -p dist/config-final
            cp -R config-final/. dist/config-final/ 2>/dev/null || true
            rm -rf dist/config-final/.git dist/config-final/.github
          fi
          # /build-flow-v2/ = build-flow-v2 branch contents
          if [ -d build-flow-v2 ]; then
            mkdir -p dist/build-flow-v2
            cp -R build-flow-v2/. dist/build-flow-v2/ 2>/dev/null || true
            rm -rf dist/build-flow-v2/.git dist/build-flow-v2/.github
          fi
          # /flow-canvas/ = flow-canvas branch contents
          if [ -d flow-canvas ]; then
            mkdir -p dist/flow-canvas
            cp -R flow-canvas/. dist/flow-canvas/ 2>/dev/null || true
            rm -rf dist/flow-canvas/.git dist/flow-canvas/.github
          fi
          # /vertical-tree/ = vertical-tree branch contents
          if [ -d vertical-tree ]; then
            mkdir -p dist/vertical-tree
            cp -R vertical-tree/. dist/vertical-tree/ 2>/dev/null || true
            rm -rf dist/vertical-tree/.git dist/vertical-tree/.github
          fi
          # /diagnostic-flow/ = diagnostic-flow branch contents
          if [ -d diagnostic-flow ]; then
            mkdir -p dist/diagnostic-flow
            cp -R diagnostic-flow/. dist/diagnostic-flow/ 2>/dev/null || true
            rm -rf dist/diagnostic-flow/.git dist/diagnostic-flow/.github
          fi
          # /delta-view/ = delta-view branch contents
          if [ -d delta-view ]; then
            mkdir -p dist/delta-view
            cp -R delta-view/. dist/delta-view/ 2>/dev/null || true
            rm -rf dist/delta-view/.git dist/delta-view/.github
          fi
          # /delta-v14-final/
          if [ -d delta-v14-final ]; then
            mkdir -p dist/delta-v14-final
            cp -R delta-v14-final/. dist/delta-v14-final/ 2>/dev/null || true
            rm -rf dist/delta-v14-final/.git dist/delta-v14-final/.github
          fi
          # /delta-v13-cleanup/
          if [ -d delta-v13-cleanup ]; then
            mkdir -p dist/delta-v13-cleanup
            cp -R delta-v13-cleanup/. dist/delta-v13-cleanup/ 2>/dev/null || true
            rm -rf dist/delta-v13-cleanup/.git dist/delta-v13-cleanup/.github
          fi
          # /delta-v12-fixes/
          if [ -d delta-v12-fixes ]; then
            mkdir -p dist/delta-v12-fixes
            cp -R delta-v12-fixes/. dist/delta-v12-fixes/ 2>/dev/null || true
            rm -rf dist/delta-v12-fixes/.git dist/delta-v12-fixes/.github
          fi
          # Simple landing index for the previews dir
          cat > dist/previews.html <<'EOF'
          <!doctype html><meta charset=utf-8>
          <title>Previews · User-flow</title>
          <style>body{font:16px/1.5 system-ui;max-width:560px;margin:60px auto;padding:0 24px;color:#0E1428}
          a{color:#002976;display:block;padding:10px 0;border-bottom:1px solid #eee;text-decoration:none}
          a:hover{background:#f6f7fb}h1{font-size:22px;letter-spacing:-.02em}</style>
          <h1>Previews</h1>
          <a href="./config.html">main · config.html</a>
          <a href="./config-v2/config.html">config-v2 · config.html</a>
          <a href="./config-v2/issue-card.html">config-v2 · issue-card.html</a>
          <a href="./context-card/context-card.html">context-card · context-card.html</a>
          <a href="./context-card/config.html">context-card · config.html</a>
          <a href="./config-dashboard/config.html">config-dashboard · config.html</a>
          <a href="./config-final/config.html">config-final · config.html</a>
          <a href="./lifecycle.html">main · lifecycle.html</a>
          EOF
          ls -la dist
          ls -la dist/config-v2 2>/dev/null || echo "no config-v2 dir"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DP · Diagnostic Tree Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#eef2f7; --panel:#ffffff; --line:#d7dde6; --line2:#e8ecf1;
  --ink:#0E1428; --ink2:#3a4358; --ink3:#6b7589;
  --accent:#0a6e9e; --accent-soft:#e6f2f8; --accent-ink:#06465f;
  --radius:16px; --shadow:0 1px 2px rgba(20,33,48,.04),0 14px 36px rgba(20,33,48,.08);
  --shadow-sm:0 1px 2px rgba(20,33,48,.05);
  --font:'Hanken Grotesk',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
#root{height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;}
.muted{color:var(--ink3);}

.app{display:flex;flex-direction:column;height:100vh;}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:20px;padding:0 18px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;}
.hdr-left{display:flex;align-items:center;gap:12px;min-width:230px;}
.hdr-logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;}
.hdr-titles{line-height:1.2;display:flex;flex-direction:column;gap:1px}
.hdr-title{font-weight:700;font-size:14.5px;letter-spacing:-.01em;margin:0;line-height:1.2}
.hdr-crumb{font-size:11.5px;color:var(--ink3);margin:0;line-height:1.3}
.hdr-crumb strong{color:var(--ink2);font-weight:600;}

/* Builder / Templates toggle pill (top right) */
.bt-toggle{display:inline-flex;align-items:center;gap:2px;background:#eef2f6;padding:3px;border-radius:999px;margin-left:8px}
.bt-tab{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 16px;border-radius:999px;border:0;cursor:pointer;
  font:600 12.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink2);
  background:transparent;letter-spacing:.1px;transition:.15s;
}
.bt-tab:hover{color:var(--ink)}
.bt-tab.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(10,110,158,.25)}
.bt-tab-n{
  display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;
  font:700 10.5px 'IBM Plex Mono',monospace;border-radius:999px;
  background:rgba(255,255,255,.18);color:inherit;
}
.bt-tab:not(.on) .bt-tab-n{background:rgba(20,33,48,.08);color:var(--ink3)}

/* Templates page */
.tpl-view{padding:28px 40px 60px;max-width:1080px;margin:0 auto;width:100%;overflow:auto;height:100%}
.tpl-view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}
.tpl-view-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.tpl-view-head p{margin:4px 0 0;font-size:13px;color:var(--ink3)}
.tpl-view-count{font:700 11px 'IBM Plex Mono',monospace;color:var(--ink3);background:#eef2f6;padding:5px 10px;border-radius:999px;letter-spacing:.3px;text-transform:uppercase}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tpl-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:.15s}
.tpl-card:hover{border-color:var(--accent);box-shadow:0 8px 22px -10px rgba(10,110,158,.22)}
.tpl-card-h{display:flex;align-items:center;gap:11px}
.tpl-card-ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#ECDFFB,#D6BFF5);display:grid;place-items:center;font-size:18px;flex:none}
.tpl-card-meta{min-width:0;flex:1}
.tpl-card-name{font:700 13.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.tpl-card-sub{font:600 10.5px 'JetBrains Mono','IBM Plex Mono',monospace;color:var(--ink3);letter-spacing:.3px;margin-top:2px}
.tpl-card-actions{display:flex;gap:6px;margin-top:auto}
.tpl-card-load{flex:1;padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;font:700 12px 'Plus Jakarta Sans';letter-spacing:.2px}
.tpl-card-load:hover{filter:brightness(1.08)}
.tpl-card-del{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink3);cursor:pointer;font:600 12px 'Plus Jakarta Sans'}
.tpl-card-del:hover{border-color:#c0473a;color:#c0473a}
.tpl-empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.tpl-empty-ic{font-size:42px;margin-bottom:14px}
.tpl-empty h3{margin:0 0 8px;font-size:17px;color:var(--ink)}
.tpl-empty p{margin:0;font-size:13px;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.5}
.hdr-modes{display:flex;gap:6px;margin:0 auto;background:#eef2f6;padding:4px;border-radius:11px;}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;padding:6px 15px;border-radius:8px;line-height:1.2;transition:.15s;white-space:nowrap;}
.modebtn-l{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;}
.modebtn-s{font-size:10.5px;color:var(--ink3);}
.modebtn.on{background:var(--panel);box-shadow:var(--shadow-sm);}
.modebtn.on .modebtn-l{color:var(--accent);}
.modebtn:hover:not(.on){background:rgba(255,255,255,.6);}
.hdr-right{display:flex;align-items:center;gap:8px;min-width:230px;justify-content:flex-end;}
.savechip{font-size:11.5px;color:var(--ink3);padding:4px 8px;border-radius:6px;}
.savechip.saving{color:var(--accent);}
.hdr-btn{font-size:12px;font-weight:600;color:var(--ink2);padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);transition:.15s;}
.hdr-btn:hover{border-color:var(--ink3);color:var(--ink);}

.hint-bar{flex:none;padding:7px 18px;font-size:12px;color:var(--ink2);background:#fbfcfd;border-bottom:1px solid var(--line2);}
.stage{flex:1;min-height:0;position:relative;}

/* ============ CANVAS ============ */
.cv-root{display:flex;height:100%;}
.cv-palette{width:212px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;}
.cv-palette-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:2px 4px 7px;}
.cv-chip{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left;transition:.13s;touch-action:none;}
.cv-chip:hover{border-color:var(--c);background:var(--cs);transform:translateX(2px);}
.cv-chip-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;flex:none;}
.cv-chip-tx{font-size:14px;font-weight:600;color:var(--ink);}
.cv-palette-tip{margin-top:auto;font-size:11px;color:var(--ink3);padding:10px 4px 2px;line-height:1.5;}

.cv-viewport{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--bg);touch-action:none;}
.cv-dots{position:absolute;inset:0;background-image:radial-gradient(circle,#e4e8ed 1px,transparent 1px);pointer-events:none;}
.cv-world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.cv-edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
.cv-edgehit{stroke:transparent;stroke-width:18px;fill:none;pointer-events:stroke;cursor:pointer;}
.cv-edgelabel{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:10px;font-weight:600;color:var(--ink2);padding:3px 10px;white-space:nowrap;line-height:1.3;box-shadow:0 1px 3px rgba(20,33,48,.06);max-width:150px;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.cv-edgedel{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--ink3);box-shadow:var(--shadow);cursor:pointer;pointer-events:auto;transition:.12s;}
.cv-edgedel:hover{background:#fdecea;border-color:#e7a59c;color:#c0473a;transform:scale(1.08);}

.cv-node{position:absolute;background:#fff;border:1.5px solid #c9d2de;border-radius:18px;box-shadow:0 2px 4px rgba(14,20,40,.06),0 14px 32px rgba(14,20,40,.09);padding:16px 18px 18px;cursor:grab;user-select:none;transition:box-shadow .16s,transform .16s,border-color .16s;}
.cv-node:hover{box-shadow:0 2px 6px rgba(20,33,48,.06),0 18px 44px rgba(20,33,48,.11);transform:translateY(-1px);}
.cv-node.is-sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 18px 44px rgba(20,33,48,.12);}
.cv-node.is-tgt{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.cv-node-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cv-node-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;flex:none;}
.cv-node-cat{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ci);background:var(--cg);padding:4px 11px;border-radius:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px;}
.cv-node-sub{font-weight:600;opacity:.7;}
.cv-node-tools{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s;}
.cv-node:hover .cv-node-tools{opacity:1;}
.cv-tool{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;color:var(--ink3);}
.cv-tool:hover{background:var(--line2);color:var(--ink);}
.cv-node-title{font-size:15px;font-weight:600;line-height:1.34;color:var(--ink);letter-spacing:-.01em;}
.cv-node-detail{font-size:12.5px;color:var(--ink2);line-height:1.46;margin-top:5px;}
.cv-opts{margin-top:12px;padding-top:9px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:1px;}
.cv-opt{position:relative;display:flex;align-items:center;gap:10px;padding:7px 5px;font-size:12.5px;border-radius:9px;transition:background .12s;}
.cv-opt:hover{background:var(--cs);}
.cv-opt-l{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c);background:#fff;color:var(--c);font-weight:700;font-size:10px;flex:none;}
.cv-opt-tx{color:var(--ink2);font-weight:500;line-height:1.3;overflow:hidden;}

.cv-anchor{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--c);cursor:crosshair;z-index:3;transition:transform .12s,background .12s,box-shadow .12s;}
/* Input anchor — visible circle at the top-center of every card; connection lines terminate here */
.cv-anchor.cv-in{
  left:50%;top:-7px;transform:translateX(-50%);
  border-color:var(--c);background:#fff;
  box-shadow:0 0 0 3px #fff,0 1px 3px rgba(20,33,48,.22);
}
.cv-anchor.cv-out{right:-7px;}
/* Option-level outbound anchor — pinned to the card's outer right edge so connection lines clearly emerge from each option's circle. */
.cv-opt{padding-right:8px}
.cv-opt .cv-out{
  top:50%;right:-24px;transform:translateY(-50%);
  box-shadow:0 0 0 3px #fff,0 1px 3px rgba(20,33,48,.22);
}
.cv-opt:hover .cv-out{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--cs)}
.cv-out-single{right:-7px;top:22px;}
.cv-anchor:hover{background:var(--c);transform:scale(1.2);}
.cv-opt .cv-out:hover{transform:translateY(-50%) scale(1.2);}

/* ============ VERTICAL TREE ============ */
.vt-root{display:flex;height:100%;}
.vt-scroll{flex:1;min-width:0;overflow:auto;position:relative;background:var(--bg);background-image:radial-gradient(circle,#e4e8ed 1px,transparent 1px);background-size:24px 24px;}
.vt-sizer{position:relative;}
.vt-world{position:absolute;top:0;left:0;transform-origin:0 0;}
.vt-edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
.vt-card{cursor:pointer;}
.vt-add{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--ink3);box-shadow:var(--shadow);opacity:0;transition:.12s;z-index:5;}
.vt-card:hover .vt-add{opacity:1;}
.vt-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

.cv-ghost{position:fixed;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--c);border-left:3px solid var(--c);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);pointer-events:none;z-index:999;opacity:.95;}

.cv-toolbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#0E1428;border:0;border-radius:999px;padding:6px;box-shadow:0 16px 36px -10px rgba(20,30,60,.45);z-index:60;}
.vt-toolbar{position:fixed!important;bottom:28px;left:50%;}
.cv-toolbar .cv-tbtn{padding:9px 12px;border-radius:999px;color:#fff;background:transparent;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:700 12px 'Plus Jakarta Sans',sans-serif;letter-spacing:.2px;transition:.15s}
.cv-toolbar .cv-tbtn:hover{background:rgba(255,255,255,.12)}
.cv-toolbar .cv-tbpct{padding:9px 16px;font:700 12px 'IBM Plex Mono',monospace;color:#fff;letter-spacing:.4px;background:rgba(255,255,255,.08);border-radius:999px}

/* Multi-select highlight via marquee */
.vt-card.is-multi-sel{
  border-color:var(--accent)!important;
  box-shadow:0 0 0 2px var(--accent),0 14px 34px -10px rgba(10,110,158,.35)!important;
}

/* Free-floating images dropped onto the canvas */
.vt-image{
  position:absolute;display:block;
  border-radius:10px;overflow:visible;
  box-shadow:0 2px 4px rgba(14,20,40,.08),0 10px 28px rgba(14,20,40,.12);
  cursor:grab;user-select:none;z-index:5;
  background:#fff;
}
.vt-image.is-dragging{cursor:grabbing;outline:2px solid var(--accent);outline-offset:2px}
.vt-image:hover{outline:2px solid var(--accent);outline-offset:2px}
.vt-image img{width:100%;height:100%;display:block;border-radius:10px;pointer-events:none;object-fit:cover}
.vt-img-del{
  position:absolute;top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;
  background:#fff;border:1.5px solid var(--line);color:var(--ink2);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  font:700 14px 'Plus Jakarta Sans',sans-serif;line-height:1;z-index:2;
  box-shadow:0 4px 10px rgba(14,20,40,.18);
}
.vt-image:hover .vt-img-del{display:flex}
.vt-img-del:hover{background:#fdecea;color:#c0473a;border-color:#c0473a}
.vt-img-handle{
  position:absolute;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid var(--accent);
  display:none;z-index:2;
  box-shadow:0 1px 3px rgba(14,20,40,.18);
}
.vt-image:hover .vt-img-handle,.vt-image.is-dragging .vt-img-handle{display:block}
.vt-img-nw{top:-7px;left:-7px;cursor:nwse-resize}
.vt-img-ne{top:-7px;right:-7px;cursor:nesw-resize}
.vt-img-sw{bottom:-7px;left:-7px;cursor:nesw-resize}
.vt-img-se{bottom:-7px;right:-7px;cursor:nwse-resize}
.cv-tbtn{display:flex;align-items:center;gap:5px;padding:7px 9px;border-radius:7px;color:var(--ink2);font-size:12px;font-weight:600;}
.cv-tbtn:hover{background:var(--line2);color:var(--ink);}
.cv-tbpct{min-width:48px;justify-content:center;font-variant-numeric:tabular-nums;}
.cv-tbsep{width:1px;height:20px;background:var(--line);margin:0 3px;}
.cv-stats{position:absolute;bottom:18px;right:16px;font-size:11px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-variant-numeric:tabular-nums;}

/* inspector */
.cv-inspector{width:0;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;transition:width .18s;}
.cv-inspector.open{width:330px;}
.vt-inspector{width:344px;}
.dash{padding:18px 16px;display:flex;flex-direction:column;gap:16px;}
.dash-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);}
.dash-trigger{background:var(--accent-soft);border:1px solid #cfe6f1;border-radius:13px;padding:13px 14px;}
.dash-trigger-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);}
.dash-trigger-t{font-size:15px;font-weight:700;color:var(--accent-ink);margin-top:4px;line-height:1.3;}
.dash-trigger-d{font-size:12px;color:#3d6f86;margin-top:5px;line-height:1.45;}
.dash-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.dash-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
.dash-stat.warn{background:#fdf4ec;border-color:#f0d8bf;}
.dash-statval{font-size:24px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
.dash-stat.warn .dash-statval{color:#b5751b;}
.dash-statlabel{font-size:11px;color:var(--ink3);margin-top:5px;font-weight:600;}
.dash-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:-6px;}
.dash-list{display:flex;flex-direction:column;gap:9px;}
.dash-row{display:flex;align-items:center;gap:9px;}
.dash-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.dash-name{font-size:12.5px;color:var(--ink2);font-weight:500;width:82px;flex:none;}
.dash-bar{flex:1;height:7px;background:var(--line2);border-radius:6px;overflow:hidden;}
.dash-barfill{display:block;height:100%;border-radius:6px;}
.dash-count{font-size:12.5px;font-weight:700;color:var(--ink);width:18px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
.dash-tip{font-size:11.5px;color:var(--ink3);line-height:1.5;border-top:1px solid var(--line2);padding-top:12px;}
.cv-insp-empty{padding:40px 24px;text-align:center;color:var(--ink2);}
.cv-insp-empty-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--line2);color:var(--ink3);margin:0 auto 14px;}
.cv-insp-empty p{font-size:13px;margin:6px 0;}
.cv-insp-empty .muted{font-size:11.5px;line-height:1.5;}

/* ---------- editor (shared) ---------- */
.editor{padding:16px;display:flex;flex-direction:column;gap:13px;}
.ed-typehead{display:flex;align-items:center;gap:10px;padding-bottom:13px;border-bottom:1px solid var(--line2);}
.ed-typeicon{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;flex:none;}
.ed-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);}
.ed-typeselect{font-size:13.5px;font-weight:600;color:var(--ink);border:none;background:none;padding:1px 0;cursor:pointer;max-width:230px;}
.ed-subselect{display:block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--c);background:var(--cs);border:1px solid var(--c);border-radius:7px;padding:3px 7px;cursor:pointer;max-width:230px;}
.ed-tpl{background:linear-gradient(120deg,#f3f0fb,#eef5f2);border:1px solid #e7e3f3;border-radius:13px;padding:11px;}
.ed-tplhead{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#6a5aa6;margin-bottom:8px;}
.ed-tplsearch{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;color:var(--ink3);}
.ed-tplsearch:focus-within{border-color:#9a86d6;box-shadow:0 0 0 3px #ece5fb;}
.ed-tplinput{flex:1;border:none;background:none;font-size:13px;color:var(--ink);min-width:0;}
.ed-tplinput:focus{outline:none;}
.ed-tplclose{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;color:var(--ink3);}
.ed-tplclose:hover{background:var(--line2);color:var(--ink);}
.ed-tpllist{margin-top:7px;max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;}
.ed-tplitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border-radius:8px;text-align:left;transition:.12s;}
.ed-tplitem:hover{background:#f3f0fb;}
.ed-tplitem.on{background:#ece5fb;}
.ed-tplname{font-size:12.5px;font-weight:500;color:var(--ink);line-height:1.25;}
.ed-tpltag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#6a5aa6;background:#efeafb;padding:2px 7px;border-radius:20px;flex:none;}
.ed-tplempty{padding:12px;font-size:12px;color:var(--ink3);text-align:center;}

/* header templates menu */
.hdr-menuwrap{position:relative;}
.hdr-menu{position:absolute;top:calc(100% + 8px);right:0;width:300px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:60;}
.hdr-menu-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);}
.hdr-menu-save{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;margin-bottom:8px;}
.hdr-menu-save:hover{background:var(--accent-ink);}
.hdr-menu-list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.hdr-menu-empty{padding:18px 12px;font-size:12px;color:var(--ink3);text-align:center;line-height:1.5;}
.hdr-tpl{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;transition:.12s;}
.hdr-tpl:hover{background:var(--line2);}
.hdr-tpl-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none;}
.hdr-tpl-tx{flex:1;min-width:0;cursor:pointer;}
.hdr-tpl-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-tpl-meta{font-size:10.5px;color:var(--ink3);}
.hdr-tpl-del{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;color:var(--ink3);flex:none;opacity:0;transition:.12s;}
.hdr-tpl:hover .hdr-tpl-del{opacity:1;}
.hdr-tpl-del:hover{background:#fdecea;color:#c0473a;}
.menu-backdrop{position:fixed;inset:0;z-index:55;}
.ed-field{display:flex;flex-direction:column;gap:5px;}
.ed-label{font-size:11px;font-weight:600;color:var(--ink2);}
.ed-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);background:#fff;transition:.13s;}
.ed-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.ed-input-sm{padding:6px 9px;font-size:12px;}
.ed-area{resize:vertical;line-height:1.45;}
.ed-block{display:flex;flex-direction:column;gap:8px;}
.ed-blockhead{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);}
.ed-count{display:grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--line2);color:var(--ink2);font-size:10px;}
.ed-optrow{display:flex;gap:7px;align-items:flex-start;}
.ed-optletter{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:10px;flex:none;margin-top:6px;}
.ed-optfields{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
.ed-route{display:flex;align-items:center;gap:6px;}
.ed-arrow{color:var(--ink3);font-size:13px;}
.ed-select{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;color:var(--ink2);min-width:0;}
.ed-select:focus{outline:none;border-color:var(--accent);}
.ed-x{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--ink3);flex:none;margin-top:4px;}
.ed-x:hover{background:#f9e9e6;color:#b54234;}
.ed-addopt{display:flex;align-items:center;gap:5px;align-self:flex-start;font-size:12px;font-weight:600;color:var(--accent);padding:5px 9px;border-radius:7px;border:1px dashed var(--line);}
.ed-addopt:hover{background:var(--accent-soft);border-color:var(--accent);}
.ed-terminal{font-size:12px;color:var(--ink2);background:var(--line2);border-radius:8px;padding:10px 12px;text-align:center;}
.ed-actions{display:flex;gap:8px;padding-top:6px;border-top:1px solid var(--line2);}
.ed-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;}
.ed-btn:hover{border-color:var(--ink3);color:var(--ink);}
.ed-btn-danger{color:#b54234;}
.ed-btn-danger:hover{border-color:#b54234;background:#f9e9e6;}

/* ============ OUTLINE ============ */
.ol-root{display:flex;height:100%;}
.ol-main{flex:1;min-width:0;overflow:auto;padding:26px 0 60px;}
.ol-doc{max-width:760px;margin:0 auto;padding:0 24px;}
.ol-row{position:relative;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;min-height:38px;transition:background .1s;}
.ol-row:hover{background:#fff;box-shadow:var(--shadow-sm);}
.ol-row.is-sel{background:#fff;box-shadow:0 0 0 1px var(--accent),var(--shadow-sm);}
.ol-row.is-ref{opacity:.7;cursor:default;}
.ol-row.is-ref:hover{background:none;box-shadow:none;}
.ol-guide{position:absolute;top:0;bottom:0;width:1px;background:var(--line);}
.ol-caret{display:grid;place-items:center;width:18px;height:18px;flex:none;color:var(--ink3);transition:transform .12s;}
.ol-caret.empty{visibility:hidden;}
.ol-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;flex:none;}
.ol-branch{font-size:10.5px;font-weight:600;padding:1px 8px;border:1px solid;border-radius:20px;white-space:nowrap;}
.ol-title{font-size:13.5px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ol-cat{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7;}
.ol-refmark{margin-left:auto;font-size:11px;color:var(--ink3);}
.ol-rowtools{margin-left:auto;opacity:0;transition:.12s;}
.ol-row:hover .ol-rowtools{opacity:1;}
.ol-tool{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;color:var(--accent);background:var(--accent-soft);}
.ol-tool:hover{background:var(--accent);color:#fff;}
.ol-side{width:0;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;transition:width .18s;}
.ol-side.open{width:340px;}

/* ============ WIZARD ============ */
.wz-root{display:flex;height:100%;}
.wz-rail{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;}
.wz-rail-h{display:flex;align-items:center;gap:8px;padding:16px 18px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);}
.wz-railcount{display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--line2);color:var(--ink2);font-size:10.5px;}
.wz-list{flex:1;overflow-y:auto;padding:0 10px;display:flex;flex-direction:column;gap:3px;}
.wz-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-align:left;transition:.12s;}
.wz-item:hover{background:var(--line2);}
.wz-item.is-cur{background:var(--accent-soft);}
.wz-num{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line2);color:var(--ink2);font-size:10.5px;font-weight:700;flex:none;}
.wz-item.is-cur .wz-num{background:var(--accent);color:#fff;}
.wz-item-ic{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;flex:none;}
.wz-item-tx{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
.wz-item-title{font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wz-item-sub{font-size:10.5px;color:var(--ink3);}
.wz-add{display:flex;align-items:center;justify-content:center;gap:7px;margin:10px;padding:10px;border-radius:9px;border:1px dashed var(--line);color:var(--accent);font-size:12.5px;font-weight:600;}
.wz-add:hover{background:var(--accent-soft);border-color:var(--accent);}
.wz-stage{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;padding:34px 24px 60px;}
.wz-card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;height:fit-content;}
.wz-card-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line2);background:#fbfcfd;}
.wz-step-of{font-size:12px;font-weight:600;color:var(--ink2);}
.wz-card-cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.wz-editorwrap .editor{padding:20px;gap:16px;}
.wz-editorwrap .ed-input{padding:10px 12px;font-size:14px;}
.wz-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line2);background:#fbfcfd;}
.wz-navbtn{font-size:12.5px;font-weight:600;color:var(--ink2);padding:8px 15px;border:1px solid var(--line);border-radius:9px;background:#fff;transition:.13s;}
.wz-navbtn:hover:not(:disabled){border-color:var(--ink3);color:var(--ink);}
.wz-navbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.wz-navbtn.primary:hover:not(:disabled){background:var(--accent-ink);}
.wz-navbtn:disabled{opacity:.4;cursor:not-allowed;}
.wz-dots{display:flex;gap:5px;}
.wz-dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
.wz-dot.on{background:var(--accent);width:18px;border-radius:3px;}

@media (max-width:900px){
  .hdr-left,.hdr-right{min-width:0;}
  .hdr-crumb{display:none;}
  .modebtn-s{display:none;}
}
/* Embedded-mode overrides — locked to vertical tree */
.hdr-modes{display:none!important}
.hdr{height:46px;padding:0 14px}
.hdr-left{min-width:0}
.hdr-logo{width:26px;height:26px;font-size:11px}
.hdr-title{font-size:13px}
.hint-bar{padding:6px 14px;font-size:11.5px}

/* ===== Resizable drawers (left palette + right inspector) ===== */
/* Make the palette width controllable via CSS variable so user can resize */
.cv-palette{
  position:relative;
  width:var(--paletteW,212px)!important;
  transition:width .18s ease;
}
.cv-palette.is-collapsed{
  width:64px!important;
  padding-left:8px!important;padding-right:8px!important;
}
.cv-palette.is-collapsed .cv-chip-tx,
.cv-palette.is-collapsed .cv-palette-h,
.cv-palette.is-collapsed .cv-palette-tip{display:none}
.cv-palette.is-collapsed .cv-chip{
  justify-content:center;padding:6px;width:48px;height:48px;gap:0;margin:0 auto;
}
.cv-palette.is-collapsed .cv-chip-ic{width:32px;height:32px;flex:0 0 32px}

/* Right inspector — opens automatically when a node is selected; collapses when nothing is selected. */
.cv-inspector{
  position:relative;
  width:0!important;
  overflow:hidden;
  flex:none;
  transition:width .22s cubic-bezier(.4,.0,.2,1);
  border-left:1px solid var(--line);
}
.cv-inspector.open{
  width:var(--inspectorW,344px)!important;
  overflow:visible;
}
.cv-inspector.is-collapsed{
  width:0!important;
  overflow:hidden;
}

/* ===== Floating Save-as-template button — anchored to bottom-right of the canvas viewport ===== */
.vt-tplbar{
  position:absolute;right:24px;bottom:24px;
  display:flex;align-items:center;gap:0;padding:0;
  background:transparent;border:0;z-index:50;
  pointer-events:none;
}
.vt-tplbar > *{pointer-events:auto}
.vt-tplbar-left{display:flex;flex-direction:column;gap:1px;flex:none;min-width:160px}
.vt-tplbar-h{font:700 12px 'Plus Jakarta Sans',sans-serif;letter-spacing:.2px;color:var(--ink)}
.vt-tplbar-sub{font:500 10.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink3)}
.vt-tplbar-list{display:none}
.vt-tplbar-list::-webkit-scrollbar{height:4px}
.vt-tplbar-list::-webkit-scrollbar-thumb{background:rgba(140,150,180,.35);border-radius:4px}
.vt-tpl-chip{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  padding:6px 9px;border:1px solid var(--line);border-radius:999px;
  background:#fff;font:600 11.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink);
  cursor:pointer;transition:.15s;
}
.vt-tpl-chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vt-tpl-chip-name{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt-tpl-chip-n{font:700 9.5px 'IBM Plex Mono',monospace;background:rgba(20,33,48,.06);padding:2px 6px;border-radius:8px;color:var(--ink3)}
.vt-tpl-chip-x{width:14px;height:14px;display:grid;place-items:center;border-radius:50%;color:var(--ink3);font-weight:700}
.vt-tpl-chip-x:hover{background:#fdecea;color:#c0473a}
.vt-tplbar-save{
  flex:none;display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:999px;border:0;cursor:pointer;
  background:var(--accent);color:#fff;font:700 13px 'Plus Jakarta Sans',sans-serif;
  letter-spacing:.2px;box-shadow:0 10px 28px -8px rgba(10,110,158,.45),0 0 0 1px rgba(255,255,255,.08) inset;
  transition:.18s;
}
.vt-tplbar-save:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 14px 32px -8px rgba(10,110,158,.55)}

/* No bottom-bar reservation now that the button is a floating pill */
.vt-scroll{padding-bottom:24px!important}

/* Drag cursor for vertical-tree cards — entire card grabbable except inputs/buttons */
.vt-card{cursor:grab;user-select:none}
.vt-card input,.vt-card textarea,.vt-card button{cursor:auto;user-select:text}
.vt-card.is-dragging{cursor:grabbing;box-shadow:0 14px 36px -10px rgba(10,110,158,.4),0 0 0 2px var(--accent);z-index:80}

/* Inline-editable node text */
.cv-node-title-input{
  display:block;width:100%;border:0;background:transparent;
  font:700 14.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink);
  padding:6px 12px 4px;line-height:1.3;outline:none;letter-spacing:-.01em;resize:none;
}
.cv-node-title-input::placeholder{color:#a8b1bd;font-weight:600}
.cv-node-title-input:focus{background:rgba(10,110,158,.06);border-radius:6px}
.cv-node-detail-input{
  display:block;width:100%;border:0;background:transparent;
  font:500 12px 'Plus Jakarta Sans',sans-serif;color:var(--ink3);
  padding:0 12px 8px;line-height:1.45;outline:none;resize:vertical;min-height:32px;
  font-family:inherit;
}
.cv-node-detail-input::placeholder{color:#b8c0cc}
.cv-node-detail-input:focus{background:rgba(10,110,158,.05);border-radius:6px}
.cv-opt-tx-input{
  flex:1;min-width:0;border:0;background:transparent;
  font:500 12px 'Plus Jakarta Sans',sans-serif;color:var(--ink);
  padding:4px 6px;outline:none;
}
.cv-opt-tx-input:focus{background:rgba(10,110,158,.06);border-radius:5px}
.cv-opt-tx-input::placeholder{color:#b8c0cc}
.cv-inspector.is-collapsed .editor,
.cv-inspector.is-collapsed .dash,
.cv-inspector.is-collapsed .cv-insp-empty{display:none}

/* Resize handle along the inner edge of each drawer */
.drawer-resize{
  position:absolute;top:0;bottom:0;width:6px;cursor:col-resize;z-index:60;
  background:transparent;transition:background .15s;
}
.drawer-resize:hover,.drawer-resize.is-dragging{background:rgba(10,110,158,.18)}
.cv-palette > .drawer-resize{right:-3px}
.cv-inspector > .drawer-resize{left:-3px}

/* Collapse/expand toggle button (corner of each drawer) */
.drawer-toggle{
  position:absolute;top:6px;width:24px;height:24px;border-radius:6px;
  background:#fff;border:1px solid var(--line);color:var(--ink3);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font:800 11px 'IBM Plex Mono';transition:.15s;z-index:61;
  box-shadow:0 1px 3px rgba(20,33,48,.08);
}
.drawer-toggle:hover{color:var(--accent);border-color:var(--accent)}
.cv-palette > .drawer-toggle{right:6px}
.cv-inspector > .drawer-toggle{left:6px}
.cv-palette.is-collapsed > .drawer-toggle,
.cv-inspector.is-collapsed > .drawer-toggle{left:50%;right:auto;transform:translateX(-50%)}

/* When collapsed, show a tiny vertical label */
.collapsed-label{
  position:absolute;top:38px;left:50%;transform:translate(-50%,0) rotate(-90deg);
  transform-origin:center;font:700 10px 'IBM Plex Mono';
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  white-space:nowrap;pointer-events:none;display:none;
}
.cv-palette.is-collapsed .collapsed-label,
.cv-inspector.is-collapsed .collapsed-label{display:block}
</style>
</head>

/*__js/model.jsx__*/
/* ============================================================
   DP Issue Module — Flow Builder
   Shared data model, node-type registry, seed tree, store, layout.
   Exposed on window for the other JSX files.
   ============================================================ */

/* ---- Node type registry --------------------------------- */
// branching: node routes via per-option edges (each option -> target)
// linear:    node routes via single .next
// terminal:  node has no outgoing
// subKey:    field whose value picks a sub-type (rendered as a 2nd dropdown)
const NODE_TYPES = {
  issue:        { label: 'Issue / Trigger',     cat: 'start',     glyph: 'issue',        branching: false, terminal: false, hint: 'The alert that opens the diagnostic flow' },
  question:     { label: 'Question',            cat: 'question',  glyph: 'question',     branching: true,  terminal: false, subKey: 'qType',    hint: 'Ask the operator something — each answer routes onward' },
  answer:       { label: 'Answer',              cat: 'answer',    glyph: 'answer',       branching: false, terminal: false, subKey: 'aType',    hint: 'A captured response that continues the flow' },
  waiting:      { label: 'Waiting',             cat: 'status',    glyph: 'wait',         branching: false, terminal: false, hint: 'Hold / wait for recovery or a process before continuing' },
  rootcause:    { label: 'Root cause selector', cat: 'cause',     glyph: 'root',         branching: true,  terminal: false, hint: 'Operator selects the confirmed cause — each routes to its remedy' },
  task:         { label: 'Action',              cat: 'task',      glyph: 'task',         branching: false, terminal: false, subKey: 'taskType', hint: 'A diagnostic or remedial step to perform' },
  media:        { label: 'Media upload',        cat: 'capture',   glyph: 'media',        branching: false, terminal: false, hint: 'Capture a photo / video / file as evidence' },
  validation:   { label: 'Validation step',     cat: 'capture',   glyph: 'validation',   branching: false, terminal: false, hint: 'Confirm the fix worked before closing' },
  escalation:   { label: 'Escalation',          cat: 'exception', glyph: 'escalation',   branching: false, terminal: false, subKey: 'escType',  hint: 'Escalate the issue — call the supervisor or an expert' },
  link:         { label: 'Link to next tree',   cat: 'link',      glyph: 'link',         branching: false, terminal: false, hint: 'Hand off to another diagnostic tree' },
  done:         { label: 'Done',                cat: 'terminal',  glyph: 'done',         branching: false, terminal: true,  hint: 'Closes the flow — issue resolved' },
};

// sub-type option lists (value, label)
const SUBTYPES = {
  qType:    [ ['single','Single answer'], ['yesno','Yes / No'], ['mcq','Multiple choice'], ['numeric','Numeric input'] ],
  aType:    [ ['single','Single'], ['yesno','Yes / No'], ['mcq_single','Single-select (in MCQ)'], ['numeric','Numerical input'], ['sensor','Sensor data / input'], ['range','Range slider'] ],
  taskType: [ ['diagnostic','Diagnostic step'], ['remedial','Remedial step'] ],
  role:     [ ['operator','Operator'], ['supervisor','Supervisor'] ],
  escType:  [ ['call_supervisor','Call the supervisor'], ['call_expert','Call an expert'] ],
};
function subLabel(node){
  const meta = NODE_TYPES[node.type]; if (!meta || !meta.subKey) return '';
  const list = SUBTYPES[meta.subKey] || []; const v = node[meta.subKey];

/* ---- Edge derivation ------------------------------------ */
function deriveEdges(nodes){
  const edges = [];
  Object.values(nodes).forEach(node => {
    if (BRANCHING.has(node.type)) {
      (node.options || []).forEach(o => {
        if (o.target && nodes[o.target]) edges.push({ id: node.id + '::' + o.id, from: node.id, to: o.target, label: o.label, optId: o.id, kind: 'branch' });
      });
    } else if (NODE_TYPES[node.type] && !NODE_TYPES[node.type].terminal) {
      if (node.next && nodes[node.next]) edges.push({ id: node.id + '::next', from: node.id, to: node.next, label: '', kind: 'next' });
    }
  });
  return edges;
}

/* ---- Auto layout: layered left-to-right ----------------- */
function autoLayout(nodes){
  const ids = Object.keys(nodes);
  const edges = deriveEdges(nodes);
  const outAdj = {}, inDeg = {};
  ids.forEach(id => { outAdj[id] = []; inDeg[id] = 0; });
  edges.forEach(e => { outAdj[e.from].push(e.to); });
  // longest-path layering with cycle guard
  const layer = {}; ids.forEach(id => layer[id] = 0);
  const roots = ids.filter(id => !edges.some(e => e.to === id));
  const start = roots.length ? roots : [ids[0]];
  const seen = {};
  const queue = start.map(id => [id, 0]);
  let guard = 0;
  while (queue.length && guard < 20000) {
    guard++;
    const [id, d] = queue.shift();
    if (d > layer[id]) layer[id] = d;
    if (seen[id] && seen[id] >= d) continue;
    seen[id] = d;
    outAdj[id].forEach(t => { if (d + 1 <= 60) queue.push([t, d + 1]); });
  }
  // group by layer
  const byLayer = {};
  ids.forEach(id => { (byLayer[layer[id]] = byLayer[layer[id]] || []).push(id); });
  const COLW = 320, ROWH = 150, X0 = 60, Y0 = 60;
  const pos = {};
  Object.keys(byLayer).map(Number).sort((a,b)=>a-b).forEach(L => {
    byLayer[L].forEach((id, i) => { pos[id] = { x: X0 + L * COLW, y: Y0 + i * ROWH }; });
  });
  // barycenter ordering: two sweeps to reduce crossings
  const inAdj = {}; ids.forEach(id => inAdj[id] = []);
  edges.forEach(e => inAdj[e.to].push(e.from));
  for (let sweep = 0; sweep < 3; sweep++) {
    Object.keys(byLayer).map(Number).sort((a,b)=>a-b).forEach(L => {
      const arr = byLayer[L];
      arr.sort((a,b)=>{
        const pa = inAdj[a].length ? inAdj[a].reduce((s,p)=>s+(pos[p]?pos[p].y:0),0)/inAdj[a].length : pos[a].y;
        const pb = inAdj[b].length ? inAdj[b].reduce((s,p)=>s+(pos[p]?pos[p].y:0),0)/inAdj[b].length : pos[b].y;
        return pa - pb;
      });
      arr.forEach((id,i)=>{ pos[id].y = Y0 + i * ROWH; });
    });
  }
  const out = {};
  ids.forEach(id => { out[id] = Object.assign({}, nodes[id], pos[id]); });
  return out;
}

/* Pinned-aware wrapper applied to whichever layout returns positions below */
/* ---- Vertical layout: layered top-to-bottom ------------- */
function verticalLayout(nodes){
  const ids = Object.keys(nodes);
  const edges = deriveEdges(nodes);
  const outAdj = {}; ids.forEach(id => outAdj[id] = []);
  edges.forEach(e => outAdj[e.from].push(e.to));
  const layer = {}; ids.forEach(id => layer[id] = 0);
  const roots = ids.filter(id => !edges.some(e => e.to === id));
  const start = roots.length ? roots : [ids[0]];
  const seen = {}; const queue = start.map(id => [id, 0]); let guard = 0;
  while (queue.length && guard < 20000) {
    guard++;
    const [id, d] = queue.shift();
    if (d > layer[id]) layer[id] = d;
    if (seen[id] && seen[id] >= d) continue;
    seen[id] = d;
    outAdj[id].forEach(t => { if (d + 1 <= 80) queue.push([t, d + 1]); });
  }
  const byLayer = {};
  ids.forEach(id => { (byLayer[layer[id]] = byLayer[layer[id]] || []).push(id); });
  const estH = (n) => { let h = 96; if (n.detail) h += 26; if (BRANCHING.has(n.type)) h += 16 + (n.options || []).length * 35; return h; };
  const COLW = 330, X0 = 80, Y0 = 60, GAP = 96;
  const layersSorted = Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
  const layerY = {}; let cy = Y0;
  layersSorted.forEach(L => { layerY[L] = cy; let mh = 120; byLayer[L].forEach(id => { mh = Math.max(mh, estH(nodes[id])); }); cy += mh + GAP; });
  const pos = {};
  layersSorted.forEach(L => {
    byLayer[L].forEach((id, i) => { pos[id] = { x: X0 + i * COLW, y: layerY[L] }; });
  });
  const inAdj = {}; ids.forEach(id => inAdj[id] = []);
  edges.forEach(e => inAdj[e.to].push(e.from));
  for (let sweep = 0; sweep < 4; sweep++) {
    Object.keys(byLayer).map(Number).sort((a,b)=>a-b).forEach(L => {
      const arr = byLayer[L];
      arr.sort((a,b)=>{
        const pa = inAdj[a].length ? inAdj[a].reduce((s,p)=>s+(pos[p]?pos[p].x:0),0)/inAdj[a].length : pos[a].x;
        const pb = inAdj[b].length ? inAdj[b].reduce((s,p)=>s+(pos[p]?pos[p].x:0),0)/inAdj[b].length : pos[b].x;
        return pa - pb;
      });
      arr.forEach((id,i)=>{ pos[id].x = X0 + i * COLW; });
    });
  }
  const out = {};
  ids.forEach(id => {
    const n = nodes[id];
    // Always respect an existing x/y — only auto-place nodes that don't have coordinates yet.
    // This stops nodes from jumping every time a connection is drawn, since the layout no
    // longer overrides positions just because a new edge was added.
    if (typeof n.x === 'number' && typeof n.y === 'number') {
      out[id] = Object.assign({}, n);
    } else {
      out[id] = Object.assign({}, n, pos[id]);
    }
  });
  return out;
}

/* ---- Store (localStorage) ------------------------------- */
const STORE_KEY = 'dp_flow_builder_v10_diagram';
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.nodes) return Object.assign({ images: [] }, p); }
  } catch(e){}
  return { nodes: seedTree(), images: [], view: { x: 20, y: 10, k: 0.86 }, mode: 'canvas', collapsed: {} };
}
function saveState(state){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}
function resetState(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }

/* ---- Template library (saved whole flows) --------------- */
const TPL_KEY = 'dp_flow_templates';
function listTemplates(){ try { return JSON.parse(localStorage.getItem(TPL_KEY) || '[]'); } catch(e){ return []; } }
function saveTemplate(name, nodes){
  const all = listTemplates();
  all.unshift({ id: uid('tpl'), name: name, createdAt: Date.now(), count: Object.keys(nodes).length, nodes: JSON.parse(JSON.stringify(nodes)) });
  try { localStorage.setItem(TPL_KEY, JSON.stringify(all)); } catch(e){}
  return all;
}
function deleteTemplate(id){
  const all = listTemplates().filter(t => t.id !== id);
  try { localStorage.setItem(TPL_KEY, JSON.stringify(all)); } catch(e){}
  return all;
}

Object.assign(window, {
  NODE_TYPES, CAT_META, BRANCHING, SUBTYPES, ISSUE_TEMPLATES, catOf, colorOf, subLabel, defaultSub,
  uid, opt, seedTree, deriveEdges, autoLayout, verticalLayout,
  loadState, saveState, resetState,
  listTemplates, saveTemplate, deleteTemplate,
});

</script>

                const mid = { x: (s.x + t.x) / 2, y: (s.y + t.y) / 2 };
                const col = colorOf(from.type);
                return (
                  <g key={e.id}>
                    <path d={pathD(s, t, isBranch)} fill="none" stroke={col} strokeOpacity="0.85" strokeWidth="2.5" markerEnd="url(#vtarw)" />
                    {e.label && (
                      <foreignObject x={mid.x - 78} y={mid.y - 13} width="156" height="26" style={{ overflow: 'visible' }}>
                        <div className="cv-edgelabel">{e.label}</div>
                      </foreignObject>
                    )}
                  </g>
                );
              })}
              {conn && (() => { const s = handlePt(conn.from, conn.optId); return (
                <path d={previewD(s, conn.pt)} fill="none" stroke="#0a6e9e" strokeWidth="2.2" strokeDasharray="5 4" />
              ); })()}
              {marquee && (() => {
                const x = Math.min(marquee.x0, marquee.x1), y = Math.min(marquee.y0, marquee.y1);
                const w = Math.abs(marquee.x1 - marquee.x0), h = Math.abs(marquee.y1 - marquee.y0);
                return <rect x={x} y={y} width={w} height={h} fill="rgba(10,110,158,.08)" stroke="#0a6e9e" strokeWidth="1.5" strokeDasharray="6 4" rx="6" />;
              })()}
            </svg>
            {/* Free-floating images (drag-drop onto canvas) */}
            {images.map(img => (
              <div key={img.id} className={'vt-image' + (imgDrag && imgDrag.id === img.id ? ' is-dragging' : '')}
                style={{ left: img.x, top: img.y, width: img.w, height: img.h }}
                onPointerDown={(e) => {
                  if (e.target.closest('.vt-img-handle') || e.target.closest('.vt-img-del')) return;
                  e.stopPropagation();
                  const wr = worldRef.current?.getBoundingClientRect();
                  if (!wr) return;
                  const wx = (e.clientX - wr.left) / scale;
                  const wy = (e.clientY - wr.top) / scale;
                  setImgDrag({ id: img.id, mode: 'move', ox: wx - img.x, oy: wy - img.y });
                  try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
                }}>
                <img src={img.src} alt="" draggable={false} />
                <button className="vt-img-del" title="Delete image" onPointerDown={e => e.stopPropagation()} onClick={() => deleteImage(img.id)}>×</button>
                {['nw','ne','sw','se'].map(corner => (
                  <span key={corner} className={'vt-img-handle vt-img-' + corner}
                    onPointerDown={(e) => {
                      e.stopPropagation();
                      const anchors = {
                        nw: { x: img.x + img.w, y: img.y + img.h }, // opposite: SE
                        ne: { x: img.x,         y: img.y + img.h }, // opposite: SW
                        sw: { x: img.x + img.w, y: img.y },         // opposite: NE
                        se: { x: img.x,         y: img.y }          // opposite: NW
                      };
                      setImgDrag({ id: img.id, mode: 'resize', aspect: img.w / img.h, corner, anchor: anchors[corner] });
                      try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
                    }} />
                ))}
              </div>
            ))}
            {Object.values(laid).map(n => {
              const m = NODE_TYPES[n.type] || NODE_TYPES.task; const c = CAT_META[m.cat];
              const isTgt = hoverTarget === n.id && conn;
              return (
                <div key={n.id} ref={el => nodeRefs.current[n.id] = el}
                  className={'cv-node vt-card' + (selected === n.id ? ' is-sel' : '') + (multiSel.has(n.id) ? ' is-multi-sel' : '') + (isTgt ? ' is-tgt' : '') + (drag && drag.id === n.id ? ' is-dragging' : '')}
                  style={{ left: n.x, top: n.y, width: VT_CARD_W, '--c': c.color, '--cs': c.soft, '--ci': c.ink, '--cg': c.grad }}
                  onPointerDown={(e) => {
                    // Don't start a drag from interactive bits (inputs, buttons, anchors, textareas).
                    if (e.target.closest('[data-anchor]')) return;
                    if (e.target.closest('.cv-tool')) return;
                    if (e.target.closest('input, textarea, button, select, [contenteditable="true"]')) return;
                    e.preventDefault();
                    const wr = worldRef.current ? worldRef.current.getBoundingClientRect() : { left: 0, top: 0 };
                    const wx = (e.clientX - wr.left) / scale;
                    const wy = (e.clientY - wr.top) / scale;
                    setDrag({ id: n.id, ox: wx - n.x, oy: wy - n.y });
                    setSelected(n.id);
                    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
                  }}
                  onClick={(e) => { if (e.target.closest('[data-anchor]')) return; if (e.target.closest('.cv-tool')) return; if (e.target.closest('input, textarea, button, select')) return; setSelected(n.id); }}>
                  {m.cat !== 'start' && <span className="cv-anchor cv-in" data-anchor title="input" />}
                  <div className="cv-node-head">
                    <span className="cv-node-ic" style={{ background: c.soft, color: c.color }}><Icon glyph={m.glyph} size={15} color={c.color} /></span>
                    <span className="cv-node-cat">{c.name}{subLabel(n) ? <span className="cv-node-sub"> · {subLabel(n)}</span> : null}</span>
                    <span className="cv-node-tools">
                      <button className="cv-tool" title="Duplicate" onPointerDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); duplicateNode(n.id); }}><MiniIcon name="copy" size={13} /></button>
                      <button className="cv-tool" title="Delete" onPointerDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); deleteNode(n.id); }}><MiniIcon name="trash" size={13} /></button>
                    </span>
                  </div>
                  <input className="cv-node-title cv-node-title-input" value={n.title || ''} placeholder="Untitled — type a title"
                    onChange={e => onNodes(Object.assign({}, nodes, { [n.id]: Object.assign({}, nodes[n.id], { title: e.target.value }) }))}
                    onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} />
                  <textarea className="cv-node-detail cv-node-detail-input" value={n.detail || ''} placeholder="Add a description or instruction…" rows={2}
                    onChange={e => onNodes(Object.assign({}, nodes, { [n.id]: Object.assign({}, nodes[n.id], { detail: e.target.value }) }))}
                    onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} />
                  {m.branching ? (
                    <div className="cv-opts">
                      {(n.options || []).map((o, i) => (
                        <div className="cv-opt" data-opt={o.id} key={o.id}>
                          <span className="cv-opt-l">{String.fromCharCode(65 + i)}</span>
                          <input className="cv-opt-tx cv-opt-tx-input" value={o.label || ''} placeholder="Answer"
                            onChange={e => {
                              const newLabel = e.target.value;
                              const newOpts = (n.options || []).map(x => x.id === o.id ? Object.assign({}, x, { label: newLabel }) : x);
                              onNodes(Object.assign({}, nodes, { [n.id]: Object.assign({}, nodes[n.id], { options: newOpts }) }));
                            }}
                            onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} />
                          <span className="cv-anchor cv-out" data-anchor title="drag to connect"
                            onPointerDown={(e) => { e.stopPropagation(); const w = toWorld(e.clientX, e.clientY); setConn({ from: n.id, optId: o.id, pt: w }); }} />
                        </div>
                      ))}
                    </div>
                  ) : (!m.terminal && (
                    <span className="cv-anchor cv-out cv-out-single" data-anchor data-out title="drag to connect"
                      onPointerDown={(e) => { e.stopPropagation(); const w = toWorld(e.clientX, e.clientY); setConn({ from: n.id, optId: null, pt: w }); }} />
                  ))}
                  {!m.terminal && <button className="vt-add" title="Add a step below" onClick={(e) => { e.stopPropagation(); addChild(n.id); }}><MiniIcon name="plus" size={15} /></button>}
                </div>
              );
            })}
          </div>
        </div>

        {ghost && (() => { const m = NODE_TYPES[ghost.type]; const c = CAT_META[m.cat]; return (
          <div className="cv-ghost" style={{ left: ghost.cx, top: ghost.cy, '--c': c.color, '--cs': c.soft }}>
            <span className="cv-node-ic" style={{ background: c.soft, color: c.color }}><Icon glyph={m.glyph} size={14} color={c.color} /></span>
            {m.label}
          </div>
        ); })()}
      </div>

      <div className="cv-toolbar vt-toolbar">
        <button className="cv-tbtn" onClick={() => setScale(s => Math.max(0.35, s / 1.15))} title="Zoom out (⌘/Ctrl + scroll)"><MiniIcon name="minus" size={14} /> Zoom out</button>
        <button className="cv-tbtn cv-tbpct" onClick={() => setScale(0.95)} title="Reset to 95%">{Math.round(scale * 100)}%</button>
        <button className="cv-tbtn" onClick={() => setScale(s => Math.min(2.0, s * 1.15))} title="Zoom in (⌘/Ctrl + scroll)"><MiniIcon name="plus" size={14} /> Zoom in</button>
      </div>

      <div className={'cv-inspector vt-inspector' + (selNode ? ' open' : '')}>
        {selNode && (
          <NodeEditor node={selNode} nodes={nodes}
            onChange={(nn) => onNodes(Object.assign({}, nodes, { [nn.id]: nn }))}
            onDelete={deleteNode} onDuplicate={duplicateNode} />
        )}
      </div>

    </div>
  );
}

window.VerticalTree = VerticalTree;

</script>
<script type="text/babel" data-from="js/wizard.jsx">
/*__js/wizard.jsx__*/
/* Guided builder — walk through steps one at a time, fill a friendly form, routing via dropdowns. */
function WizardView({ nodes, onNodes, selected, setSelected }){
  const edges = useMemo(() => deriveEdges(nodes), [nodes]);
  const order = useMemo(() => {
    const childrenOf = {}; edges.forEach(e => { (childrenOf[e.from] = childrenOf[e.from] || []).push(e.to); });
    const start = Object.values(nodes).find(n => n.type === 'issue') || Object.values(nodes)[0];
    const seen = new Set(); const out = []; const q = start ? [start.id] : [];
    while (q.length) { const id = q.shift(); if (seen.has(id) || !nodes[id]) continue; seen.add(id); out.push(id); (childrenOf[id] || []).forEach(t => { if (!seen.has(t)) q.push(t); }); }
    Object.keys(nodes).forEach(id => { if (!seen.has(id)) out.push(id); });
    return out;
  }, [nodes, edges]);

  const curId = (selected && nodes[selected]) ? selected : order[0];
  const curIdx = order.indexOf(curId);
  const cur = nodes[curId];

  const addStep = () => {
    const nid = uid('task');
    const last = nodes[curId];
    const nn = { id: nid, type: 'task', taskType: 'diagnostic', title: 'New step', detail: '', options: [], next: null, x: (last ? last.x : 0) + 40, y: (last ? last.y : 0) + 130 };
    const copy = Object.assign({}, nodes, { [nid]: nn });
    if (last && !BRANCHING.has(last.type) && !NODE_TYPES[last.type].terminal) { nn.next = last.next; copy[curId] = Object.assign({}, last, { next: nid }); }
    onNodes(copy); setSelected(nid);
  };
  const deleteNode = (id) => {
    const copy = {};
    Object.values(nodes).forEach(n => { if (n.id === id) return; const c = Object.assign({}, n);
      if (c.next === id) c.next = null;
      if (c.options) c.options = c.options.map(o => o.target === id ? Object.assign({}, o, { target: null }) : o);
      copy[n.id] = c; });
    onNodes(copy); setSelected(null);
  };
  const duplicateNode = (id) => {
    const src = nodes[id]; const nid = uid(src.type);
    onNodes(Object.assign({}, nodes, { [nid]: Object.assign({}, src, { id: nid, title: (src.title||'') + ' copy', options: (src.options||[]).map(o => ({ id: uid('o'), label: o.label, target: o.target })) }) }));
    setSelected(nid);
  };

  return (
    <div className="wz-root">
      <div className="wz-rail">
        <div className="wz-rail-h">Steps in this flow <span className="wz-railcount">{order.length}</span></div>
        <div className="wz-list">
          {order.map((id, i) => {
            const n = nodes[id]; const m = NODE_TYPES[n.type] || NODE_TYPES.task; const c = CAT_META[m.cat];
            const branchN = m.branching ? (n.options || []).length : 0;
            return (
              <button key={id} className={'wz-item' + (id === curId ? ' is-cur' : '')} onClick={() => setSelected(id)}>
                <span className="wz-num">{i + 1}</span>
                <span className="wz-item-ic" style={{ background: c.soft, color: c.color }}><Icon glyph={m.glyph} size={13} color={c.color} /></span>
                <span className="wz-item-tx">
                  <span className="wz-item-title">{n.title || 'Untitled'}</span>
                  <span className="wz-item-sub">{subLabel(n) || c.name}{branchN ? ' · ' + branchN + ' answers' : ''}</span>
                </span>
              </button>
            );
          })}
        </div>
        <button className="wz-add" onClick={addStep}><MiniIcon name="plus" size={14} /> Add a step</button>
      </div>

      <div className="wz-stage">
        {cur ? (
          <div className="wz-card">
            <div className="wz-card-top">
              <span className="wz-step-of">Step {curIdx + 1} of {order.length}</span>
              <span className="wz-card-cat" style={{ color: CAT_META[catOf(cur.type)].color }}>{CAT_META[catOf(cur.type)].name}</span>
            </div>
            <div className="wz-editorwrap">
              <NodeEditor node={cur} nodes={nodes}
                onChange={(nn) => onNodes(Object.assign({}, nodes, { [nn.id]: nn }))}
                onDelete={deleteNode} onDuplicate={duplicateNode} />
            </div>
            <div className="wz-nav">
              <button className="wz-navbtn" disabled={curIdx <= 0} onClick={() => setSelected(order[curIdx - 1])}>← Previous</button>
              <span className="wz-dots">{order.map((id, i) => <span key={id} className={'wz-dot' + (i === curIdx ? ' on' : '')} />)}</span>
              <button className="wz-navbtn primary" disabled={curIdx >= order.length - 1} onClick={() => setSelected(order[curIdx + 1])}>Next →</button>
            </div>
          </div>
        ) : <div className="cv-insp-empty"><p>No steps yet — add one to begin.</p></div>}
      </div>
    </div>
  );
}

window.WizardView = WizardView;

</script>
<script type="text/babel" data-from="js/app.jsx">
/*__js/app.jsx__*/
/* App shell — header, mode switcher, shared state + persistence. */
function App(){
  const initial = useMemo(() => loadState(), []);
  const [nodes, setNodes] = useState(initial.nodes);
  const [images, setImages] = useState(initial.images || []);
  const [view, setView] = useState(initial.view || { x: 20, y: 10, k: 0.86 });
  const [mode, setMode] = useState('tree');
  const [collapsed, setCollapsed] = useState(initial.collapsed || {});
  const [selected, setSelected] = useState(null);
  const [savedAt, setSavedAt] = useState('saved');
  const [tplOpen, setTplOpen] = useState(false);
  const [tpls, setTpls] = useState(() => listTemplates());
  const [tab, setTab] = useState('builder'); // 'builder' | 'templates'

  // Bridge with the parent (config.html top-bar Builder/Templates toggle)
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === 'dp:set-tab' && (d.tab === 'builder' || d.tab === 'templates')) {
        if (d.tab === 'templates') setTpls(listTemplates());
        setTab(d.tab);
      }
    };
    window.addEventListener('message', onMsg);
    // Tell the parent how many templates we have on boot
    try { window.parent.postMessage({ type: 'dp:tpl-count', count: listTemplates().length }, '*'); } catch(_){}
    return () => window.removeEventListener('message', onMsg);
  }, []);
  // Keep parent in sync whenever templates list or tab changes
  useEffect(() => {
    try { window.parent.postMessage({ type: 'dp:tpl-count', count: tpls.length }, '*'); } catch(_){}
  }, [tpls]);
  useEffect(() => {
    try { window.parent.postMessage({ type: 'dp:tab', tab }, '*'); } catch(_){}
  }, [tab]);

  // debounced persist
  const tRef = useRef(null);
  useEffect(() => {
    setSavedAt('saving');
    clearTimeout(tRef.current);
    tRef.current = setTimeout(() => { saveState({ nodes, images, view, mode, collapsed }); setSavedAt('saved'); }, 500);
  }, [nodes, images, view, mode, collapsed]);

  const onNodes = (nn) => setNodes(nn);

  const reset = () => {
    if (!confirm('Reset to the seeded "Low DO in Aeration Tank" flow? Your changes will be lost.')) return;
    resetState(); const s = loadState();
    setNodes(s.nodes); setView(s.view); setCollapsed({}); setSelected(null);
  };
  const blank = () => {
    if (!confirm('Start from a blank canvas with just the Issue trigger?')) return;
    const id = 'issue';
    setNodes({ issue: { id, type: 'issue', title: 'New issue', detail: 'Describe the alert that opens this flow.', options: [], next: null, x: 120, y: 200 } });
    setSelected('issue'); setCollapsed({});
  };

  const saveTpl = () => {
    const name = prompt('Name this template — e.g. “Low DO · standard tree”');
    if (!name) return;
    setTpls(saveTemplate(name.trim(), nodes));
  };
  const loadTpl = (t) => {
    if (!confirm('Load template “' + t.name + '”? This replaces what’s on the canvas now.')) return;
    setNodes(JSON.parse(JSON.stringify(t.nodes))); setSelected(null); setCollapsed({}); setTplOpen(false);
  };
  const delTpl = (e, id) => { e.stopPropagation(); setTpls(deleteTemplate(id)); };

  const modes = [
    { k: 'canvas', label: 'Flow canvas', sub: 'Free-form' },
    { k: 'tree', label: 'Vertical tree', sub: 'Top-down' },
    { k: 'wizard', label: 'Guided', sub: 'Step-by-step' },
  ];

  return (
    <div className="app">
      <header className="hdr">
        <div className="hdr-left">
          <span className="hdr-logo">DP</span>
          <div className="hdr-titles">
            <div className="hdr-title">Diagnostic Tree Builder</div>
            <div className="hdr-crumb">Issue module · <strong>Low DO in Aeration Tank</strong> · DT-001 draft</div>
          </div>
        </div>

        <div className="hdr-modes">
          {modes.map(m => (
            <button key={m.k} className={'modebtn' + (mode === m.k ? ' on' : '')} onClick={() => { setMode(m.k); }}>
              <span className="modebtn-l">{m.label}</span>
              <span className="modebtn-s">{m.sub}</span>
            </button>
          ))}
        </div>

        <div className="hdr-right">
          <span className={'savechip ' + savedAt}>{savedAt === 'saving' ? 'Saving…' : '✓ Saved'}</span>
        </div>
      </header>

      <div className="hint-bar">
        {mode === 'canvas' && 'Drag step chips onto the canvas. Drag the dot on a step\u2019s right edge to another step to connect them. Hover any connection and click the \u2715 to delete it. Scroll to pan, \u2318+scroll or the toolbar to zoom, Tidy to auto-arrange.'}
        {mode === 'tree' && 'A vertical, top-to-bottom branching tree — the issue at the top, each answer branching downward into its own path. Click a card to edit it, hover a card and press + to add a step beneath it.'}
        {mode === 'wizard' && 'The same flow as a guided walkthrough — pick a step on the left, fill the form, set where each answer routes. Lowest learning curve for non-technical authors.'}
      </div>

      <main className="stage">
        {tab === 'builder' ? (
          <React.Fragment>
            {mode === 'canvas' && <FlowCanvas nodes={nodes} onNodes={onNodes} selected={selected} setSelected={setSelected} view={view} setView={setView} />}
            {mode === 'tree' && <VerticalTree nodes={nodes} onNodes={onNodes} selected={selected} setSelected={setSelected} images={images} setImages={setImages} />}
            {mode === 'wizard' && <WizardView nodes={nodes} onNodes={onNodes} selected={selected} setSelected={setSelected} />}
          </React.Fragment>
        ) : (
          <div className="tpl-view">
            <div className="tpl-view-head">
              <div>
                <h2>Templates</h2>
                <p>Saved flows you can load into the Builder and tweak per plant.</p>
              </div>
              <div className="tpl-view-count">{tpls.length} saved</div>
            </div>
            {tpls.length === 0 ? (
              <div className="tpl-empty">
                <div className="tpl-empty-ic">📐</div>
                <h3>No templates yet</h3>
                <p>Build a flow, then use <b>Save as template</b> on the Build the flow screen to save it here.</p>
              </div>
            ) : (
              <div className="tpl-grid">
                {tpls.map(t => (
                  <div key={t.id} className="tpl-card">
                    <div className="tpl-card-h">
                      <span className="tpl-card-ic">📐</span>
                      <div className="tpl-card-meta">
                        <div className="tpl-card-name">{t.name}</div>
                        <div className="tpl-card-sub">{t.count} steps · saved {new Date(t.createdAt).toLocaleDateString()}</div>
                      </div>
                    </div>
                    <div className="tpl-card-actions">
                      <button className="tpl-card-load" onClick={() => { loadTpl(t); setTab('builder'); }}>Load into Builder</button>
                      <button className="tpl-card-del" onClick={(e) => delTpl(e, t.id)} title="Delete template">Delete</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

/* ===== Resizable / collapsible drawers ===== */
(function(){
  function ensureDrawerControls(){
    document.querySelectorAll('.cv-palette, .cv-inspector').forEach(drawer => {
      if (drawer.dataset.resizable) return;
      drawer.dataset.resizable = '1';
      const isLeft = drawer.classList.contains('cv-palette');

      // Collapsed label
      const lbl = document.createElement('div');
      lbl.className = 'collapsed-label';
      lbl.textContent = isLeft ? 'STEPS' : 'INSPECTOR';
      drawer.appendChild(lbl);

      // Toggle button
      const toggle = document.createElement('button');
      toggle.className = 'drawer-toggle';
      toggle.type = 'button';
      toggle.title = 'Collapse / expand';
      toggle.textContent = isLeft ? '«' : '»';
      toggle.addEventListener('click', (e) => {
        e.preventDefault();e.stopPropagation();
        const collapsed = drawer.classList.toggle('is-collapsed');
        toggle.textContent = collapsed ? (isLeft ? '»' : '«') : (isLeft ? '«' : '»');
      });
      drawer.appendChild(toggle);

      // Resize handle
      const handle = document.createElement('div');
      handle.className = 'drawer-resize';
      handle.addEventListener('pointerdown', (e) => {
        if (drawer.classList.contains('is-collapsed')) return;
        e.preventDefault();
        handle.classList.add('is-dragging');
        const startX = e.clientX;
        const startW = drawer.getBoundingClientRect().width;
        const cssVar = isLeft ? '--paletteW' : '--inspectorW';
        const onMove = (mv) => {
          const dx = mv.clientX - startX;
          let nw = startW + (isLeft ? dx : -dx);
          nw = Math.max(140, Math.min(560, nw));
          drawer.style.setProperty(cssVar, nw + 'px');
        };
        const onUp = () => {
          handle.classList.remove('is-dragging');
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
      drawer.appendChild(handle);
    });
  }
  // Run after React mounts; drawers may also re-render when state changes (mode/selected)
  const obs = new MutationObserver(() => ensureDrawerControls());
  obs.observe(document.body, { subtree: true, childList: true });
  setTimeout(ensureDrawerControls, 100);
})();

</script>
